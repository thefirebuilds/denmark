services:
  app:
    image: ghcr.io/thefirebuilds/denmark:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Chicago}
      PORT: "5000"
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-denmark}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      PGPOOL_MAX: ${PGPOOL_MAX:-6}
      PGCONNECT_TIMEOUT_MS: ${PGCONNECT_TIMEOUT_MS:-10000}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-denmark}
    depends_on:
      - db
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./imports:/app/imports

  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PGDATABASE:-denmark}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      TZ: ${TZ:-America/Chicago}
      PGTZ: ${TZ:-America/Chicago}
    volumes:
      - denmark_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - denmark_mosquitto_data:/mosquitto/data

volumes:
  denmark_pgdata:
  denmark_mosquitto_data:
