name: Publish container

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_sha: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        id: build_meta
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DENMARK_BUILD_COMMIT=${{ github.sha }}
            DENMARK_BUILD_TIME=${{ steps.build_meta.outputs.time }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Verify pushed image setup scripts
        run: |
          set -euo pipefail
          docker pull "${{ steps.image.outputs.name }}:latest"
          docker run --rm "${{ steps.image.outputs.name }}:latest" sh -lc '
            set -eu
            find /app/setup -maxdepth 1 -type f -print
            test -f /app/setup/bootstrap-db.js
            test -f /app/setup/verify-db-bootstrap.js
            test -f /app/server/db/schema.sql
            test ! -e /app/setup/bootstrap-db.cjs
            test ! -e /app/setup/verify-db-bootstrap.cjs
            cat /app/server/package.json | grep -A5 -B5 db:
            grep -q "node ../setup/bootstrap-db.js" /app/server/package.json
            grep -q "node ../setup/verify-db-bootstrap.js" /app/server/package.json
          '

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Deploy app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              for candidate in "$HOME/denmark" /opt/denmark /srv/denmark; do
                if [ -f "$candidate/docker-compose.yml" ]; then
                  DEPLOY_PATH="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$DEPLOY_PATH" ] || [ ! -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              echo "Could not find docker-compose.yml for Denmark deploy." >&2
              echo "whoami: $(whoami)" >&2
              echo "pwd: $(pwd)" >&2
              echo "HOME: ${HOME:-}" >&2
              echo "Nearby files:" >&2
              ls -la >&2 || true
              echo "HOME nearby files:" >&2
              ls -la "$HOME" >&2 || true
              echo "Home files:" >&2
              find "$HOME" -maxdepth 2 -type f \( -name 'docker-compose.yml' -o -name 'compose.yml' -o -name 'compose.yaml' \) -print 2>/dev/null >&2 || true
              echo "/opt compose files:" >&2
              find /opt -maxdepth 3 -type f \( -name 'docker-compose.yml' -o -name 'compose.yml' -o -name 'compose.yaml' \) -print 2>/dev/null >&2 || true
              echo "/srv compose files:" >&2
              find /srv -maxdepth 3 -type f \( -name 'docker-compose.yml' -o -name 'compose.yml' -o -name 'compose.yaml' \) -print 2>/dev/null >&2 || true
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ -d .git ]; then
              git pull --ff-only
            fi

            docker compose pull app freshcoastgarage mosquitto
            docker compose run --rm app npm run db:bootstrap
            docker compose run --rm app npm run db:verify
            docker compose up -d --force-recreate mosquitto
            docker compose up -d --force-recreate app
            docker compose up -d --no-deps --force-recreate freshcoastgarage
            docker compose exec -T freshcoastgarage node - <<'NODE' || { docker compose logs --tail=12 freshcoastgarage; exit 1; }
            const assert = require("node:assert/strict");
            const { setTimeout: delay } = require("node:timers/promises");
            const origin = "http://127.0.0.1:5080";
            const get = path => fetch(origin + path, { signal: AbortSignal.timeout(10000) });

            async function verify() {
              for (let attempt = 0; attempt < 12; attempt += 1) {
                try {
                  const response = await get("/api/public/availability");
                  assert.equal(response.status, 200);
                  const data = await response.json();
                  assert.equal(data.ok, true);
                  assert.ok(Array.isArray(data.vehicles));
                  const page = await get("/");
                  assert.equal(page.status, 200);
                  const html = await page.text();
                  assert.match(html, /Fresh Coast Garage/);
                  const roster = new Set(Array.from(html.matchAll(/turoVehicleId: "(\d+)"/g), match => match[1]));
                  assert.ok(roster.size > 0);
                  assert.ok(data.vehicles.every(vehicle => roster.has(String(vehicle.turoVehicleId))));
                  assert.equal((await get("/api/vehicles")).status, 404);
                  assert.equal((await get("/api/vehicle-availability-ingest.php")).status, 404);
                  console.log(`Fresh Coast Garage staged with ${data.vehicles.length} public listings`);
                  return;
                } catch (error) {
                  if (attempt === 11) throw error;
                  await delay(3000);
                }
              }
            }

            verify().catch(error => { console.error(error); process.exitCode = 1; });
            NODE
            if [ -f /etc/nginx/sites-enabled/zz-freshcoastgarage-denmark ]; then
              bash docker/install-freshcoastgarage-nginx.sh --check
            else
              echo "Fresh Coast Garage is staged on localhost. An administrator must install the Nginx route before DNS cutover."
            fi
            docker compose ps
            docker compose ps mosquitto | grep -F '0.0.0.0:1883->1883/tcp'

            docker image prune -f
