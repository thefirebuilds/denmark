name: Publish container

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_sha: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Verify pushed image setup scripts
        run: |
          set -euo pipefail
          docker pull "${{ steps.image.outputs.name }}:latest"
          docker run --rm "${{ steps.image.outputs.name }}:latest" sh -lc '
            set -eu
            find /app/setup -maxdepth 1 -type f -print
            test -f /app/setup/bootstrap-db.js
            test -f /app/setup/verify-db-bootstrap.js
            test -f /app/server/db/schema.sql
            test ! -e /app/setup/bootstrap-db.cjs
            test ! -e /app/setup/verify-db-bootstrap.cjs
            cat /app/server/package.json | grep -A5 -B5 db:
            grep -q "node ../setup/bootstrap-db.js" /app/server/package.json
            grep -q "node ../setup/verify-db-bootstrap.js" /app/server/package.json
          '

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Deploy app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /opt/denmark

            docker compose pull app
            docker compose up -d --force-recreate app

            docker image prune -f